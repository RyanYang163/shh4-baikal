services:
  shh4-baikal:
    image: ckulka/baikal:nginx
    container_name: shh4-baikal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18804:80"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh4-baikal/data:/var/www/baikal/Specific
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

x-app-meta:
  web:
    port: 18804
    protocol: http
